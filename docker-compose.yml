services:
  postgres:
    image: postgres:16-alpine
    container_name: exaqube-postgres
    environment:
      POSTGRES_DB: exaqube
      POSTGRES_USER: exaqube
      POSTGRES_PASSWORD: exaqube_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db:/db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exaqube -d exaqube"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: exaqube-backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://exaqube:exaqube_dev@postgres:5432/exaqube
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: exaqube-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
